<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendra — Widget de progression</title>
  <style>
    :root {
      /* Neutres alignés sur le thème Sombre de l'application (#16181c/#101216).
         Les anciens tons « slate » (#0f172a/#020617) tiraient vers le bleu et
         juraient avec la palette neutre du reste de l'interface. */
      --neutral-50: #eef0f3;
      --neutral-100: #e6e8ec;
      --neutral-400: #9aa1ac;
      --neutral-500: #6b7280;
      --neutral-700: #3d434f;
      --neutral-800: #262a30;
      --neutral-900: #1c1f24;
      --neutral-950: #101216;
      --primary-400: #5fa79d;
      --primary-500: #4d9086;
      --primary-600: #226a61;
      --accent-500: #c2a25a;
      --success-400: #4ade80;
      --success-500: #22c55e;
      --error-400: #f87171;
      --error-500: #ef4444;
      --warning-500: #f59e0b;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-full: 999px;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 3px 0 rgba(0,0,0,0.08);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.15), 0 8px 10px -6px rgba(0,0,0,0.08);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --transition-fast: 150ms ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--neutral-950);
      color: var(--neutral-50);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .widget-container {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, var(--neutral-900) 0%, var(--neutral-950) 100%);
      min-height: 100vh;
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .widget-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-400);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .widget-logo { flex-shrink: 0; display: block; }

    .widget-status-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.05);
    }

    .status-idle { background: var(--neutral-500); }
    .status-running { background: var(--success-500); animation: pulse 1.2s infinite; }
    .status-error { background: var(--error-500); }
    .status-completed { background: var(--primary-400); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .widget-percent {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: var(--neutral-50);
      letter-spacing: -0.02em;
      padding: 4px 0;
    }

    .widget-progress-bar {
      height: 6px;
      background: var(--neutral-800);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid var(--neutral-800);
    }

    .widget-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-500), var(--success-400));
      border-radius: var(--radius-full);
      transition: width 0.4s ease;
      width: 0%;
    }

    .widget-message {
      font-size: 12px;
      color: var(--neutral-400);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 17px;
    }

    .widget-footer {
      display: flex;
      justify-content: center;
      -webkit-app-region: no-drag;
      margin-top: 4px;
    }

    .widget-close-btn {
      background: transparent;
      border: 1px solid var(--neutral-700);
      color: var(--neutral-400);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .widget-close-btn:hover {
      border-color: var(--error-500);
      color: var(--error-400);
      background: rgba(239, 68, 68, 0.08);
    }

    .widget-close-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="widget-header">
      <span class="widget-title">
        <svg class="widget-logo" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true" focusable="false">
          <rect x="8" y="8" width="240" height="240" rx="56" fill="#123f3a"/>
          <rect x="60" y="150" width="20" height="50" rx="6" fill="#ffffff" opacity="0.45"/>
          <rect x="92" y="122" width="20" height="78" rx="6" fill="#ffffff" opacity="0.65"/>
          <rect x="124" y="94" width="20" height="106" rx="6" fill="#ffffff" opacity="0.85"/>
          <path d="M118 62 L152 62 L186 148 L160 148 L135 86 L110 148 L84 148 Z" fill="#ffffff"/>
          <circle cx="196" cy="188" r="16" fill="#f0b429"/>
        </svg>
        Vendra
      </span>
      <span class="widget-status-dot status-idle" id="statusDot"></span>
    </div>
    <div class="widget-percent" id="percentText">—</div>
    <div class="widget-progress-bar">
      <div class="widget-progress-fill" id="progressFill"></div>
    </div>
    <div class="widget-message" id="messageText">En attente…</div>
    <div class="widget-footer">
      <button class="widget-close-btn" id="closeBtn">Fermer</button>
    </div>
  </div>
  <script>
    const statusDot = document.getElementById('statusDot');
    const percentText = document.getElementById('percentText');
    const progressFill = document.getElementById('progressFill');
    const messageText = document.getElementById('messageText');

    window.widgetApi.onProgress((data) => {
      if (data.percent != null) {
        percentText.textContent = data.percent + '%';
        progressFill.style.width = Math.min(100, Math.max(0, data.percent)) + '%';
      }
      if (data.status) {
        messageText.textContent = data.status;
      }
    });

    window.widgetApi.onStatus((data) => {
      const st = data.state || 'idle';
      // Le widget mappe chaque état sur une classe visuelle EXISTANTE. Les états
      // non listés (capturing, processing, cancelled, refused, rate_limited,
      // access_unverified) retombaient sur 'status-' + st → classes CSS
      // inexistantes (status-capturing…) → le point de statut perdait toute
      // couleur. On mappe désormais TOUS les états connus explicitement, avec
      // 'status-idle' en repli sûr.
      const isError = st === 'error' || st === 'refused' || st === 'rate_limited' || st === 'access_unverified' || st === 'access_restricted';
      const dotClass = (st === 'completed' || st === 'partial') ? 'status-completed'
        : isError ? 'status-error'
        : (st === 'capturing' || st === 'processing') ? 'status-running'
        : 'status-idle';
      statusDot.className = 'widget-status-dot ' + dotClass;
      if (data.message) {
        messageText.textContent = data.message;
      }
      if (st === 'completed' || st === 'partial') {
        percentText.textContent = st === 'partial' ? '~' : '✓';
        progressFill.style.width = '100%';
      } else if (isError) {
        percentText.textContent = '!';
        progressFill.style.width = '0%';
      }
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.widgetApi.close();
    });
  </script>
</body>
</html>
