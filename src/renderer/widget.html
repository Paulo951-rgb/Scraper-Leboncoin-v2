<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget — Leboncoin Scraper Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .widget-container {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .widget-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .widget-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-idle { background: #64748b; }
    .status-running { background: #22c55e; animation: pulse 1.2s infinite; }
    .status-error { background: #ef4444; }
    .status-completed { background: #38bdf8; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .widget-message {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 17px;
    }
    .widget-progress-bar {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .widget-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      border-radius: 3px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .widget-percent {
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      color: #f8fafc;
    }
    .widget-footer {
      display: flex;
      justify-content: center;
      -webkit-app-region: no-drag;
    }
    .widget-close-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 11px;
      padding: 3px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .widget-close-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="widget-header">
      <span class="widget-title">🛒 Scraper Pro</span>
      <span class="widget-status-dot status-idle" id="statusDot"></span>
    </div>
    <div class="widget-percent" id="percentText">—</div>
    <div class="widget-progress-bar">
      <div class="widget-progress-fill" id="progressFill"></div>
    </div>
    <div class="widget-message" id="messageText">En attente…</div>
    <div class="widget-footer">
      <button class="widget-close-btn" id="closeBtn">Fermer</button>
    </div>
  </div>
  <script>
    const statusDot = document.getElementById('statusDot');
    const percentText = document.getElementById('percentText');
    const progressFill = document.getElementById('progressFill');
    const messageText = document.getElementById('messageText');

    window.widgetApi.onProgress((data) => {
      if (data.percent != null) {
        percentText.textContent = data.percent + '%';
        progressFill.style.width = Math.min(100, Math.max(0, data.percent)) + '%';
      }
      if (data.status) {
        messageText.textContent = data.status;
      }
    });

    window.widgetApi.onStatus((data) => {
      statusDot.className = 'widget-status-dot status-' + (data.state || 'idle');
      if (data.message) {
        messageText.textContent = data.message;
      }
      if (data.state === 'completed') {
        percentText.textContent = '✓';
        progressFill.style.width = '100%';
      } else if (data.state === 'error') {
        percentText.textContent = '!';
        progressFill.style.width = '0%';
      }
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.widgetApi.close();
    });
  </script>
</body>
</html>
